name: Build dagu TWRP A16 test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Check out device tree
        uses: actions/checkout@v4

      - name: Reclaim build space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h .

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex gperf libncurses-dev libssl-dev libxml2-utils python3 rsync unzip xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync minimal TWRP source with skkk recovery
        run: |
          mkdir -p "$RUNNER_TEMP/twrp"
          cd "$RUNNER_TEMP/twrp"
          "$HOME/bin/repo" init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/skkk.xml <<'EOF'
          <manifest>
            <remote name="skkk" fetch="https://github.com/" />
            <remove-project name="android_bootable_recovery" />
            <project name="sekaiacg/twrp_recovery" path="bootable/recovery" remote="skkk" revision="android-12.1" />
          </manifest>
          EOF
          "$HOME/bin/repo" sync -c --no-tags --no-clone-bundle -j4
          df -h .

      - name: Add dagu device tree and A16 mount fix
        run: |
          mkdir -p "$RUNNER_TEMP/twrp/device/xiaomi/dagu"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/twrp/device/xiaomi/dagu"
          test -s "$RUNNER_TEMP/twrp/device/xiaomi/dagu/prebuilt/kernel"
          python3 .github/scripts/patch_decrypt_retry.py "$RUNNER_TEMP/twrp/bootable/recovery/partitionmanager.cpp"

      - name: Build recovery-as-boot image
        shell: bash
        run: |
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_dagu-eng
          mka bootimage -j2
          test -s out/target/product/dagu/boot.img
          cp out/target/product/dagu/boot.img "$GITHUB_WORKSPACE/boot.img"
          cd "$GITHUB_WORKSPACE"
          sha256sum boot.img > SHA256SUMS

      - name: Upload test image
        uses: actions/upload-artifact@v4
        with:
          name: dagu-twrp-a16-test
          path: |
            boot.img
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7
